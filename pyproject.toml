[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ck-downloader"
version = "0.1.0"
description = "CookieRun: Kingdom asset downloader/extractor (offline XAPK mode + DevPlay CDN in progress)"
requires-python = ">=3.10"
dependencies = ["UnityPy>=1.25", "Pillow>=10", "cloudscraper>=1.2.71"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ck-downloader = "ck_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
